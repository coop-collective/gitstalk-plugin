name: test

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  manifests:
    # Only main opts into the pilot; unset/false restores GitHub-hosted Linux.
    runs-on: ${{ vars.ENGINEBOX_CI_ENABLED == 'true' && github.ref == 'refs/heads/main' && fromJSON('["self-hosted", "Linux", "X64", "enginebox-linux"]') || 'ubuntu-latest' }}
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Manifests are valid JSON and agree on the MCP server and version
        run: |
          node -e '
            const fs = require("fs");
            const read = (f) => JSON.parse(fs.readFileSync(f, "utf8"));
            for (const f of [".claude-plugin/marketplace.json", "package.json"]) read(f);
            const claude = read(".claude-plugin/plugin.json"), codex = read(".codex-plugin/plugin.json");
            const prod = "https://mcp.gitstalk.io/mcp";
            if (read(".mcp.json").mcpServers.gitstalk.url !== "${user_config.mcp_url}") throw new Error("Claude Code MCP url must be the mcp_url option");
            if (claude.userConfig.mcp_url.default !== prod) throw new Error("mcp_url must default to production");
            if (codex.mcpServers !== "./.codex-mcp.json" || read(".codex-mcp.json").mcpServers.gitstalk.url !== prod) throw new Error("Codex needs a literal production MCP url");
            for (const k of ["name", "version", "description"]) if (claude[k] !== codex[k]) throw new Error(`manifests disagree on ${k}`);
          '
      - name: Validate with Claude Code
        run: npx -y @anthropic-ai/claude-code plugin validate .

  setup-scripts:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ vars.ENGINEBOX_CI_ENABLED == 'true' && github.ref == 'refs/heads/main' && matrix.os == 'ubuntu-latest' && fromJSON('["self-hosted", "Linux", "X64", "enginebox-linux"]') || matrix.os }}
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - run: sh test/setup-tests.sh
